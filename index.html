<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PQC HealthVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071018;--card:#0D1924;--card2:#112232;--primary:#54E2B3;--text:#E8EDF5;--muted:#718096;
  --warn:#F0C969;--danger:#FF6B6B;--line:rgba(140,170,200,.15);
  --glow:0 0 0 1px rgba(84,226,179,.35),0 0 26px rgba(84,226,179,.16);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(84,226,179,.09),transparent 60%),radial-gradient(900px 520px at -10% 8%,rgba(70,120,210,.12),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(140,170,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,200,.05) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%)}
#app{position:relative;z-index:1}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,34px);line-height:1.15}
h2{font-size:18px}h3{font-size:15px}
p{margin:0 0 10px}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:rgba(84,226,179,.08);border:1px solid rgba(84,226,179,.16);padding:1px 6px;border-radius:5px;color:#b9f5df;word-break:break-all}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* banner */
.banner{background:rgba(240,201,105,.09);border-bottom:1px solid rgba(240,201,105,.3);color:#f4dc9b;font-size:12.5px;padding:7px 16px;text-align:center}
.banner b{color:var(--warn)}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px clamp(14px,3vw,32px);
  background:rgba(7,16,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:17px;letter-spacing:.01em}
.brand b{font-weight:700}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#062018;background:linear-gradient(135deg,#7bf0c9,#2bb88c)}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav a{padding:7px 13px;border-radius:9px;color:#a9b6c8;font-size:14px;white-space:nowrap}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav a.on{color:var(--primary);background:rgba(84,226,179,.09)}
.right{display:flex;align-items:center;gap:10px;margin-left:auto}
.user{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.user b{font-size:13.5px;font-weight:600}.user span{font-size:12px;color:var(--muted)}
@media(max-width:820px){.nav{order:3;flex-basis:100%}.user{display:none}}

.wrap{max-width:1160px;margin:0 auto;padding:30px clamp(14px,3vw,32px) 90px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:24px}
.head p{color:var(--muted);margin:6px 0 0}

/* cards + layout */
.card{background:rgba(13,25,36,.72);border:1px solid var(--line);border-radius:16px;padding:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card.flat{border-radius:12px;padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{margin-top:24px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:34px 0 14px}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1.1;margin-top:6px}
.stat span{color:var(--muted);font-size:13px}

/* buttons / chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(140,170,200,.3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#052018;border-color:var(--primary);font-weight:600}
.btn.primary:hover{background:#78ecc6}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.45);color:#ffb3b3}
.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line);color:#b6c2d2;white-space:nowrap}
.chip.ok{color:var(--primary);border-color:rgba(84,226,179,.4);background:rgba(84,226,179,.08)}
.chip.warn{color:var(--warn);border-color:rgba(240,201,105,.4);background:rgba(240,201,105,.08)}
.chip.bad{color:var(--danger);border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.08)}
.chip .ico{width:13px;height:13px}
.alg{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:#c7d2e0;background:rgba(255,255,255,.03)}
.alg.ok{border-color:rgba(84,226,179,.35);color:#9ff0d3}
.alg.sim{border-color:rgba(240,201,105,.35);color:#f2d98f}
.legend{font-size:12.5px;color:var(--muted)}

/* forms */
label{display:block;font-size:13px;color:#a9b6c8;margin:14px 0 6px;font-weight:500}
input[type=email],input[type=password],select{width:100%;padding:11px 13px;background:rgba(7,16,24,.7);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid rgba(84,226,179,.6);outline-offset:1px}
select option{background:#0D1924}
.drop{border:1.5px dashed rgba(84,226,179,.35);border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;transition:.2s;background:rgba(84,226,179,.03)}
.drop:hover,.drop.over{background:rgba(84,226,179,.09);border-color:var(--primary)}
.drop .ico{width:30px;height:30px;color:var(--primary);margin-bottom:6px}
.drop small{display:block;color:var(--muted);margin-top:4px}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}

/* records */
.rec{display:flex;flex-direction:column;gap:12px}
.rec h3{font-size:16px}
.rec .meta{color:var(--muted);font-size:13px}
.rec .badges{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;font-size:13px;margin:4px 0}
.kv span{color:var(--muted);min-width:110px}

/* pipeline */
.pipe{display:grid;gap:12px}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(13,25,36,.6);transition:border-color .3s,box-shadow .3s}
.step .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;border:1px solid var(--line);color:var(--muted)}
.step .ttl{font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step .sub{color:var(--muted);font-size:13px}
.step .detail{display:none;margin-top:10px;font-size:13.5px}
.step .state{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px}
.step.processing{border-color:rgba(240,201,105,.45)}
.step.processing .num{border-color:var(--warn);color:var(--warn)}
.step.processing .state{color:var(--warn)}
.step.ok{border-color:rgba(84,226,179,.42);box-shadow:var(--glow)}
.step.ok .num{background:var(--primary);color:#052018;border-color:var(--primary)}
.step.ok .state{color:var(--primary)}
.step.ok .detail,.step.bad .detail{display:block}
.step.bad{border-color:rgba(255,107,107,.55)}
.step.bad .num{background:var(--danger);color:#2a0707;border-color:var(--danger)}
.step.bad .state{color:var(--danger)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(240,201,105,.25);border-top-color:var(--warn);display:inline-block;vertical-align:-3px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){.step{grid-template-columns:36px 1fr}.step .state{grid-column:2}}

/* secured */
.secured{text-align:center;padding:34px 20px;border-radius:18px;border:1px solid rgba(84,226,179,.5);background:linear-gradient(180deg,rgba(84,226,179,.12),rgba(13,25,36,.75));box-shadow:var(--glow)}
.secured .shield{width:64px;height:64px;color:var(--primary);margin:0 auto 6px;display:block;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.secured h2{font-size:26px;letter-spacing:.06em}

/* tables */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px;background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:0}

/* flow diagram */
.flow{display:grid;justify-items:center;gap:0}
.node{padding:10px 18px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);min-width:220px;text-align:center;font-size:14px}
.node small{display:block;color:var(--muted);font-size:12px}
.node.a{border-color:rgba(84,226,179,.4)}.node.s{border-color:rgba(240,201,105,.4)}
.arrow{width:2px;height:22px;background:linear-gradient(var(--line),rgba(84,226,179,.6));position:relative}
.arrow::after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:7px solid rgba(84,226,179,.7);border-bottom:0}

/* attacker */
.breach{display:grid;justify-items:center;gap:6px;padding:10px 0}
.bnode{padding:10px 20px;border-radius:12px;border:1px solid var(--line);opacity:.35;transition:.5s;font-weight:500}
.bnode.on{opacity:1;border-color:rgba(255,107,107,.55);color:#ffc0c0;box-shadow:0 0 22px rgba(255,107,107,.15)}
.bar{width:min(320px,80%);height:6px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--danger),var(--warn));transition:width 1.4s ease}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .ico{width:16px;height:16px}
.li.c .ico{color:var(--warn)}.li.n .ico{color:var(--primary)}
.li code{margin-left:auto;font-size:11.5px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result{font-size:22px;font-weight:600}
.alert{border:1px solid rgba(255,107,107,.6);background:rgba(255,107,107,.1);border-radius:14px;padding:20px;animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.good{border:1px solid rgba(84,226,179,.5);background:rgba(84,226,179,.08);border-radius:14px;padding:20px;box-shadow:var(--glow)}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.vrow:last-child{border-bottom:0}.vrow .r{margin-left:auto;font-family:var(--mono);font-size:12.5px}
.vrow.ok .r{color:var(--primary)}.vrow.bad .r{color:var(--danger)}.vrow.pend .r{color:var(--muted)}
.doc{background:#050c12;border:1px solid var(--line);border-radius:12px;padding:16px;max-height:340px;overflow:auto;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.doc img{max-width:100%;border-radius:8px}

/* judge */
.judge{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));z-index:40;border-radius:16px;border:1px solid rgba(84,226,179,.45);background:rgba(7,16,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none}
.judge.open{display:block}
.judge .j{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.judge .j b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--primary)}
.judge .j span{color:var(--muted)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;position:relative}
.login canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.login .l,.login .r{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,72px)}
.hero{font-size:clamp(46px,8vw,92px);line-height:.95;font-weight:700;letter-spacing:-.035em}
.hero span{display:block;font-weight:300;color:var(--primary)}
.tag{font-size:clamp(20px,2.6vw,28px);margin:22px 0 8px;font-weight:500}
@media(max-width:860px){.login{grid-template-columns:1fr}.login .l{padding-bottom:0}}
.demo{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.demo button{cursor:pointer;font:inherit;font-size:12.5px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c7d2e0}
.demo button:hover{border-color:var(--primary);color:var(--primary)}
.load{min-height:100vh;display:grid;place-items:center;text-align:center;color:var(--muted)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"><div class="load"><div><span class="spin"></span><p class="mono" style="margin-top:12px">Initialising cryptographic providers…</p></div></div></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=t=>new Promise(r=>setTimeout(r,t));
const TE=new TextEncoder(),TD=new TextDecoder();
const hex=u=>Array.from(u,b=>b.toString(16).padStart(2,'0')).join('');
function b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const short=(h,n=8)=>h.length>2*n+3?h.slice(0,n)+'…'+h.slice(-n):h;
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const fmtDate=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtTime=d=>d.toLocaleTimeString('en-GB',{hour12:false});
const fmtMs=x=>x<10?x.toFixed(2)+' ms':x.toFixed(1)+' ms';
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const ico=p=>`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  shield:'<path d="M12 3l8 3v6c0 4.6-3.2 7.8-8 9.5C7.2 19.8 4 16.6 4 12V6z"/>',
  shieldok:'<path d="M12 3l8 3v6c0 4.6-3.2 7.8-8 9.5C7.2 19.8 4 16.6 4 12V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.3v.01"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  upload:'<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
  half:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/>'
};
const CHK=ico(I.check),XX=ico(I.x);

/* ============ crypto (Web Crypto = REAL; PQC = simulated placeholder) ============ */
const PROFILE={id:'PQC-HV-1.0',kem:'ML-KEM-768',sig:'ML-DSA-65',sym:'AES-256-GCM',hash:'SHA-256'};
const S={user:null,records:[],audit:[],kek:null,seq:42};
const C={
  async sha(u){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',u)))},
  async encrypt(u){
    const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u));
    return{key,iv,ct};
  },
  async wrap(key){
    const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
    const wiv=crypto.getRandomValues(new Uint8Array(12));
    const wrapped=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:wiv},S.kek,raw));
    raw.fill(0);return{wrapped,wiv};
  },
  async unwrap(r){
    const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.wiv},S.kek,r.wrapped));
    const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);raw.fill(0);return k;
  },
  kem(){return crypto.getRandomValues(new Uint8Array(1088))},      // SIMULATED: random bytes, NOT ML-KEM-768
  sign(){return crypto.getRandomValues(new Uint8Array(3309))},     // SIMULATED: random bytes, NOT ML-DSA-65
  digest(r){return this.sha(cat(r.ct,r.iv,r.kemCt,r.wrapped,r.wiv,TE.encode(JSON.stringify([r.id,r.patientId,r.filename,r.sha256,PROFILE.id]))))}
};
async function verify(r){
  const o={sig:false,kem:false,aes:false,sha:false,pt:null,t:{}};
  let t=performance.now();
  try{o.sig=(await C.digest(r))===r.pkgDigest}catch{}
  o.t.sig=performance.now()-t;t=performance.now();
  let k=null;try{k=await C.unwrap(r);o.kem=true}catch{}
  o.t.kem=performance.now()-t;t=performance.now();
  try{o.pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.iv},k,r.ct));o.aes=true}catch{}
  o.t.aes=performance.now()-t;t=performance.now();
  if(o.pt)o.sha=(await C.sha(o.pt))===r.sha256;
  o.t.sha=performance.now()-t;
  o.ok=o.sig&&o.kem&&o.aes&&o.sha;return o;
}

/* ============ data ============ */
const USERS={
  'doctor@demo.health':{email:'doctor@demo.health',role:'DOCTOR',name:'Dr. Sarah Mitchell',sub:'Cardiology Department',home:'/doctor/dashboard'},
  'patient@demo.health':{email:'patient@demo.health',role:'PATIENT',name:'Alex Morgan',sub:'Patient #1042',pid:1042,home:'/patient/dashboard'},
  'admin@demo.health':{email:'admin@demo.health',role:'ADMIN',name:'Security Admin',sub:'Platform administration',home:'/security'}
};
const PATIENTS=[{id:1042,name:'Alex Morgan'},{id:1043,name:'Jordan Lee'},{id:1044,name:'Taylor Smith'}];
const pname=id=>(PATIENTS.find(p=>p.id===id)||{name:'Unknown'}).name;
const DEMO_PW='demo1234';
const NAV={

function particles(cv){
  const ctx=cv.getContext('2d');let w,h,pts;
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const size=()=>{w=cv.width=cv.offsetWidth;h=cv.height=cv.offsetHeight;pts=Array.from({length:Math.min(70,Math.floor(w*h/22000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))};
  size();addEventListener('resize',size);
  (function tick(){
    if(!document.body.contains(cv))return removeEventListener('resize',size);
    ctx.clearRect(0,0,w,h);
    for(const p of pts){if(!rm){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
      ctx.fillStyle='rgba(84,226,179,.55)';ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,7);ctx.fill()}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
      if(d<130){ctx.strokeStyle=`rgba(84,226,179,${.12*(1-d/130)})`;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke()}}
    if(!rm)requestAnimationFrame(tick);
  })();
}

  log('KEM_ENCAPSULATION','SIMULATED',id,'System');log('KEY_WRAPPED','SUCCESS',id,'System');log('ML_DSA_SIGN','SIMULATED',id,'System');log('ACCESS_GRANTED','SUCCESS',id,'System');
  $('#result').innerHTML=`<div class="secured">${ico(I.shieldok).replace('class="ico"','class="ico shield"')}<h2>RECORD SECURED</h2>
    <div class="row" style="justify-content:center;margin:12px 0"><span class="alg ok">AES-256-GCM</span><span class="alg sim">ML-KEM-768 (sim)</span><span class="alg sim">ML-DSA-65 (sim)</span></div>
    <p><b>8 / 8</b> pipeline stages completed · 2 simulated in this preview</p>
    <div class="grid g4" style="text-align:left;margin:18px 0">
      <div class="card flat"><span class="muted">Record ID</span><br><code>${id}</code></div>
      <div class="card flat"><span class="muted">Encryption</span><br>AES-256-GCM</div>
      <div class="card flat"><span class="muted">Key establishment</span><br>ML-KEM-768 (sim)</div>
      <div class="card flat"><span class="muted">Signature</span><br>ML-DSA-65 (sim)</div>
      <div class="card flat"><span class="muted">Integrity</span><br>SHA-256</div>
      <div class="card flat"><span class="muted">Status</span><br><span style="color:var(--primary)">SECURED</span></div></div>
    <div class="row" style="justify-content:center"><a class="btn primary" href="#/records/${id}">View record</a><a class="btn" href="#/records/${id}">Security details</a></div></div>
    <section class="card sp"><h2 style="margin-bottom:12px">Cryptographic telemetry</h2>
    <div class="tblw"><table><thead><tr><th>Operation</th><th>Duration</th><th>Mode</th><th>Status</th></tr></thead><tbody>
    ${tele.map(t=>`<tr><td>${t.op}</td><td class="mono">${fmtMs(t.ms)}</td><td>${t.mode==='REAL'?'<span class="chip ok">REAL</span>':'<span class="chip warn">SIMULATED</span>'}</td><td><span class="chip ok">✓ Done</span></td></tr>`).join('')}
    </tbody></table></div><p class="legend" style="margin:10px 0 0">Durations are measured in your browser at runtime. Simulated rows only time the placeholder, not a real PQC operation.</p></section>`;
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});
}

function canAccess(r){const u=S.user;if(u.role==='DOCTOR')return r.doctor===u.name;if(u.role==='PATIENT')return r.patientId===u.pid;return false}
function pgRecord(id){
  const r=S.records.find(x=>x.id===id);
  if(!r)return{html:`<div class="card"><h1>Record not found</h1><p class="muted">No record with ID ${esc(id)}.</p><a class="btn" href="#${S.user.home}">Back</a></div>`};
  if(!canAccess(r)){
    log('ACCESS_DENIED','DENIED',r.id);
    return{html:`<div class="alert"><h1 style="color:var(--danger)">${ico(I.alert)} Access denied</h1>
      <p style="margin-top:10px">${S.user.role==='ADMIN'?'Administrators manage the platform, not patient charts.':'You are not on the access list for this record.'} Authorization failed before any decryption was attempted.</p>
      <p class="legend">Event <code>ACCESS_DENIED</code> written to the audit log.</p><a class="btn" href="#${S.user.home}">Back to dashboard</a></div>`};
  }
  const html=`<div class="head"><div><h1>${esc(r.filename)}</h1><p>Medical record · <code>${r.id}</code></p></div><span class="chip ${r.tampered?'bad':'ok'}">${r.tampered?'TAMPERED':'SECURED'}</span></div>
  <div class="grid two"><section class="card"><h2 style="margin-bottom:10px">Details</h2>
    <div class="kv"><span>Shared by</span>${esc(r.doctor)}</div><div class="kv"><span>Patient</span>${esc(pname(r.patientId))} (#${r.patientId})</div>
    <div class="kv"><span>Created</span>${fmtDate(r.created)}</div><div class="kv"><span>Size</span>${fmtBytes(r.size)}</div>
    <div class="kv"><span>SHA-256</span><code>${short(r.sha256,8)}</code></div><div class="kv"><span>Crypto profile</span><code>${PROFILE.id}</code></div>
    <div class="row" style="margin-top:14px">${algs()}<span class="alg ok">SHA-256 ✓</span></div>
    <div class="row" id="acts" style="margin-top:18px"><button class="btn primary" id="view">View document</button><button class="btn" id="dl">Download</button><button class="btn" id="vfy">Verify security</button></div></section>
  <section class="card"><h2 style="margin-bottom:8px">Security status</h2><p class="legend">Nothing is shown before verification has actually run.</p>
    <div id="vbox"><div class="vrow pend"><span>ML-DSA-65 signature</span><span class="r">NOT RUN</span></div><div class="vrow pend"><span>KEM key recovery</span><span class="r">NOT RUN</span></div><div class="vrow pend"><span>AES-GCM authentication</span><span class="r">NOT RUN</span></div><div class="vrow pend"><span>SHA-256 integrity</span><span class="r">NOT RUN</span></div></div>
    <div id="verdict" style="margin-top:14px"></div></section></div>
  <div id="docwrap" class="sp"></div>`;
  return{html,init(){
    const run=async mode=>{
      $$('#acts .btn').forEach(b=>b.disabled=true);
      $('#verdict').innerHTML='';$('#docwrap').innerHTML='';
      log('SIGNATURE_VERIFICATION','SUCCESS',r.id);
      const res=await verify(r);
      await playVerify($('#vbox'),res);
      $$('#acts .btn').forEach(b=>b.disabled=false);
      if(!res.ok){
        log('TAMPER_DETECTED','BLOCKED',r.id);
        $('#verdict').innerHTML=`<div class="alert"><b style="color:var(--danger)">${ico(I.alert)} TAMPERING DETECTED</b><p style="margin:6px 0 0">Record rejected. No plaintext was released.</p></div>`;return;
      }
      $('#verdict').innerHTML=`<div class="good"><b style="color:var(--primary)">${ico(I.shieldok)} RECORD AUTHENTIC</b></div>`;
      if(mode==='verify')return;
      log('DECRYPTION','SUCCESS',r.id);log('RECORD_VIEW','SUCCESS',r.id);
      if(mode==='dl'){
        const a=document.createElement('a');const blob=new Blob([res.pt],{type:r.mime});a.href=URL.createObjectURL(blob);
        a.download=r.text?r.filename.replace(/\.pdf$/,'.txt'):r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return;
      }
      let body;
      if(r.mime.startsWith('image/')){body=`<img alt="Decrypted medical image" src="${URL.createObjectURL(new Blob([res.pt],{type:r.mime}))}">`}
      else if(r.text){body=esc(TD.decode(res.pt))}
      else{body=esc('[Binary file · '+fmtBytes(res.pt.length)+']\nFirst bytes: '+hex(res.pt.subarray(0,64)))}
      $('#docwrap').innerHTML=`<section class="card"><h2 style="margin-bottom:12px">Decrypted document</h2><div class="doc">${body}</div></section>`;
    };
    $('#view').onclick=()=>run('view');$('#dl').onclick=()=>run('dl');$('#vfy').onclick=()=>run('verify');
  }};
}

function pgSecurity(){
  const card=(t,d,chip)=>`<div class="card flat"><div class="row" style="justify-content:space-between"><h3>${t}</h3>${chip}</div><p class="muted" style="margin:6px 0 0;font-size:13.5px">${d}</p></div>`;
  const html=`<div class="head"><div><h1>Security center</h1><p>What protects a record, and what is real in this preview.</p></div>
    <span class="chip bad">PQC PROVIDER (liboqs): NOT CONNECTED</span></div>
  <div class="grid g3">
    ${card('ML-KEM-768','Key encapsulation',simChip('PREVIEW · SIMULATED'))}
    ${card('ML-DSA-65','Digital signatures',simChip('PREVIEW · SIMULATED'))}
    ${card('AES-256-GCM','Medical file encryption','<span class="chip ok">ACTIVE ✓ REAL</span>')}
    ${card('SHA-256','Record fingerprinting','<span class="chip ok">ACTIVE ✓ REAL</span>')}
    ${card('RBAC','Doctor, patient and admin roles',simChip('CLIENT-SIDE'))}
    ${card('Audit','Security events recorded','<span class="chip ok">ACTIVE ✓ '+S.audit.length+' events</span>')}
  </div>
  <div class="grid two sp">
    <section class="card"><h2 style="margin-bottom:16px">Architecture</h2><div class="flow">
      <div class="node">Medical record</div><div class="arrow"></div>
      <div class="node a">AES-256-GCM<small>random key per record</small></div><div class="arrow"></div>
      <div class="node">Ciphertext + nonce</div><div class="arrow"></div>
      <div class="node s">ML-KEM-768<small>shared secret → KDF → wrapping key</small></div><div class="arrow"></div>
      <div class="node a">Wrapped AES key</div><div class="arrow"></div>
      <div class="node s">ML-DSA-65<small>signs the whole package</small></div><div class="arrow"></div>
      <div class="node">Signature</div></div>
      <p class="legend" style="margin-top:14px">Green outline: real here. Amber outline: simulated here.</p></section>
    <section class="stack"><div class="card"><h2 style="margin-bottom:6px">Crypto profile</h2><div class="kv"><span>Profile</span><code>${PROFILE.id}</code></div>
      <div class="row" style="margin-top:8px"><span class="alg">${PROFILE.kem}</span><span class="alg">${PROFILE.sig}</span><span class="alg">${PROFILE.sym}</span><span class="alg">${PROFILE.hash}</span></div>
      <p class="muted" style="font-size:13.5px;margin:12px 0 0">Every record stores the profile it was made with, so algorithms can be swapped later without losing old records.</p></div>
    <div class="card"><h2 style="margin-bottom:8px">What each piece does</h2><div class="stack" style="font-size:14px">
      <div><b>AES-256-GCM</b> encrypts the large file and detects any change to it.</div>
      <div><b>ML-KEM-768</b> agrees a shared secret that protects the AES key.</div>
      <div><b>ML-DSA-65</b> proves the protected package came from the platform and was not altered.</div>
      <div><b>SHA-256</b> gives the file a fingerprint to check after decryption.</div></div></div></section></div>`;
  return{html};
}

function pgAttacker(){
  const html=`<div class="head"><div><h1>Harvest now, decrypt later</h1><p>What happens if an attacker steals the encrypted database?</p></div><span class="chip warn">Conceptual demonstration</span></div>
  <div class="grid two"><section class="card"><label for="ar" style="margin-top:0">Record to steal</label>
    <select id="ar">${S.records.map(r=>`<option value="${r.id}">${r.id} · ${esc(r.filename)}</option>`).join('')}</select>
    <div class="breach" style="margin-top:14px"><div class="bnode" id="b0">ATTACKER</div><div class="bar"><i id="bar"></i></div><div class="bnode" id="b1">DATABASE BREACH</div><div class="bnode" id="b2">Encrypted records copied</div></div>
    <button class="btn danger" id="steal" style="width:100%">Run breach simulation</button></section>
    <section class="card" id="cap"><p class="muted">Run the simulation to see what the attacker walks away with.</p></section></div>
  <div class="grid two sp"><section class="card"><h2>Why PQC?</h2><p class="muted" style="margin-top:8px">Traditional public-key cryptography may be vulnerable to sufficiently capable future quantum computers. Attackers can store encrypted data today and try to open it years later.</p>
    <p class="muted" style="margin:0">This design uses standardized post-quantum primitives for key establishment and signatures, to reduce that risk. It is a design goal for the real backend, not something this demo can prove.</p></section>
  <section class="card"><h2>Tamper demonstration</h2><p class="muted" style="margin-top:8px">Flips one byte of the stored ciphertext, then runs verification.</p>
    <div class="row"><button class="btn danger" id="tp">Simulate record tampering</button><button class="btn" id="rs" disabled>Restore original record</button></div>
    <div id="tbox" class="sp" style="margin-top:16px"></div></section></div>`;
  return{html,init(){
    const cur=()=>S.records.find(r=>r.id===$('#ar').value);
    $('#steal').onclick=async()=>{
      const r=cur();$('#steal').disabled=true;$('#cap').innerHTML='<p class="muted">Copying…</p>';
      ['b0','b1','b2'].forEach(i=>$('#'+i).classList.remove('on'));$('#bar').style.transition='none';$('#bar').style.width='0';
      log('DB_BREACH_SIMULATION','BLOCKED',r.id,'Attacker Simulator');
      $('#b0').classList.add('on');await sleep(500);$('#b1').classList.add('on');$('#bar').style.transition='';$('#bar').style.width='100%';await sleep(1500);$('#b2').classList.add('on');await sleep(400);
      const li=(c,t,v)=>`<div class="li ${c}">${ico(c==='c'?I.check:I.x)}<span>${t}</span>${v?`<code>${v}</code>`:''}</div>`;
      $('#cap').innerHTML=`<h2 style="color:var(--warn);margin-bottom:6px">Captured</h2>
        ${li('c','Ciphertext',short(b64(r.ct),10))}${li('c','KEM ciphertext (sim)',short(b64(r.kemCt),10))}${li('c','Wrapped data key',short(b64(r.wrapped),10))}${li('c','ML-DSA signature (sim)',short(b64(r.signature),10))}${li('c','Metadata',esc(r.filename))}
        <h2 style="color:var(--primary);margin:18px 0 6px">Not available</h2>
        ${li('n','Plaintext medical record')}${li('n','AES plaintext key')}${li('n','ML-KEM private key')}${li('n','ML-DSA private key')}
        <div class="card flat" style="margin-top:16px"><span class="muted">Current result</span><div class="result">Plaintext recovered: <span style="color:var(--primary)">NO</span></div></div>
        <p class="legend" style="margin:10px 0 0">Conceptual demonstration only. It does not prove resistance against any real future quantum computer.</p>`;
      $('#steal').disabled=false;
    };
    const showV=async(res,restored)=>{
      const b=$('#tbox');
      if(!restored){b.innerHTML=`<div class="alert"><b style="color:var(--danger)">${ico(I.alert)} TAMPERING DETECTED</b><p style="margin:6px 0 10px">Record rejected.</p><div id="tv"></div></div>`}
      else{b.innerHTML=`<div class="good"><b style="color:var(--primary)">${ico(I.shieldok)} RECORD AUTHENTIC</b><div id="tv" style="margin-top:8px"></div></div>`}
      await playVerify($('#tv'),res);
    };
    $('#tp').onclick=async()=>{
      const r=cur();if(r.tampered)return;
      r.orig=r.ct.slice();r.ct[Math.floor(r.ct.length/2)]^=0x01;r.tampered=true;
      $('#tp').disabled=true;$('#rs').disabled=true;$('#ar').disabled=true;
      const res=await verify(r);log('TAMPER_DETECTED','BLOCKED',r.id,'Attacker Simulator');
      await showV(res,false);$('#rs').disabled=false;
    };
    $('#rs').onclick=async()=>{
      const r=cur();if(!r.tampered)return;
      r.ct.set(r.orig);r.orig=null;r.tampered=false;$('#rs').disabled=true;
      const res=await verify(r);log('SIGNATURE_VERIFICATION','SUCCESS',r.id,'Attacker Simulator');
      await showV(res,true);$('#tp').disabled=false;$('#ar').disabled=false;
    };
  }};
}

function pgAudit(){
  const html=`<div class="head"><div><h1>Security audit log</h1><p>${S.audit.length} events, newest first. Amber means the step was simulated in this preview.</p></div></div>
  <div class="tblw"><table><thead><tr><th>Time</th><th>User</th><th>Event</th><th>Status</th><th>Record</th></tr></thead><tbody>
  ${S.audit.slice(0,200).map(a=>`<tr><td class="mono">${fmtTime(a.t)}</td><td>${esc(a.user)}</td><td class="mono">${esc(a.event)}</td><td>${stChip(a.status)}</td><td class="mono">${esc(a.rec)}</td></tr>`).join('')}
  </tbody></table></div>`;
  return{html};
}
